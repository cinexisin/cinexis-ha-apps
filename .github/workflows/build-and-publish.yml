name: Build and publish add-on images

# Only on a tag or a manual run. Never on pull_request_target, and never on a
# pull request at all: a workflow that can write packages must not be reachable
# by code from a fork.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 4.0.1-pilot.1)'
        required: true

permissions:
  contents: read
  packages: write
  id-token: write        # keyless signing and provenance

env:
  REGISTRY: ghcr.io
  ADDON: cinexis_home

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            base: ghcr.io/home-assistant/aarch64-base:3.20
          - arch: amd64
            platform: linux/amd64
            base: ghcr.io/home-assistant/amd64-base:3.20
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      # Every third-party action is pinned to a full commit SHA. A tag can be
      # moved; a commit cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: ver
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          # The manifest is the authority on the version. A tag that disagrees
          # with it would publish an image whose config.yaml says something else.
          M=$(grep -E '^version:' "${ADDON}/config.yaml" | awk '{print $2}' | tr -d '"')
          if [ "$V" != "$M" ]; then
            echo "::error::tag/input version '$V' does not match ${ADDON}/config.yaml version '$M'"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The repository-scoped GITHUB_TOKEN. No personal access token, no
      # organisation-wide credential, and nothing that outlives this run.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cinexis-home-${{ matrix.arch }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ env.ADDON }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            BUILD_FROM=${{ matrix.base }}
            BUILD_ARCH=${{ matrix.arch }}
            CINEXIS_CHANNEL=stable
          tags: ${{ steps.meta.outputs.tags }}
          # Set here rather than via metadata-action: its generated labels take
          # precedence over supplied ones, so image.title became the repository
          # name and image.licenses came out empty. image.source is what links
          # the package to this repository, so it must be right.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=CINEXIS Home (${{ matrix.arch }})
            org.opencontainers.image.description=Connects a Home Assistant installation to a CINEXIS account
            org.opencontainers.image.licenses=LicenseRef-CINEXIS-Proprietary
            org.opencontainers.image.vendor=CINEXIS
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        env:
          # The runner is amd64. Without this, syft asks the registry for an
          # amd64 child of an arm64-only image and fails.
          SYFT_PLATFORM: ${{ matrix.platform }}
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/cinexis-home-${{ matrix.arch }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-cinexis-home-${{ matrix.arch }}.spdx.json

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the image by digest
        run: |
          set -euo pipefail
          cosign sign --yes \
            "${REGISTRY}/${{ github.repository_owner }}/cinexis-home-${{ matrix.arch }}@${{ steps.build.outputs.digest }}"

      - name: Record the digest
        run: |
          set -euo pipefail
          mkdir -p out
          printf '%s\n' "${{ steps.build.outputs.digest }}" \
            > "out/digest-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: out/

  verify:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: digests }

      # The runner is amd64; running the arm64 image needs emulation.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      # An anonymous pull. Not `docker login` — the point is to prove a customer
      # with no credentials can fetch exactly the digest we published.
      - name: Pull anonymously by digest
        run: |
          set -euo pipefail
          for arch in aarch64 amd64; do
            case "$arch" in aarch64) PLAT=linux/arm64 ;; *) PLAT=linux/amd64 ;; esac
            D=$(cat "digests/digest-${arch}/digest-${arch}.txt")
            REF="ghcr.io/${{ github.repository_owner }}/cinexis-home-${arch}@${D}"
            echo "== $REF ($PLAT)"
            docker logout ghcr.io || true
            docker pull --platform "$PLAT" "$REF"
            docker image inspect "$REF" --format 'arch={{.Architecture}} size={{.Size}}'
            # No dependencies, so no transitive scanned-session library.
            docker run --rm --platform "$PLAT" --entrypoint sh "$REF" -c '
              [ -d /app/node_modules ] && { echo "node_modules present"; exit 1; }
              for b in frpc ssh sshd docker chromium npm gcc; do
                command -v $b >/dev/null 2>&1 && { echo "$b present"; exit 1; }
              done
              node -e "const f=require(\"/app/ui/fixtures.json\");
                       if (f.states.length !== 16) { throw new Error(\"states: \"+f.states.length) }"
              echo "ok: no banned surface, sixteen contract states"'
          done

      - name: Checksums
        run: |
          set -euo pipefail
          (cd digests && find . -type f -name 'digest-*.txt' -exec sha256sum {} \;) \
            | tee SHA256SUMS
