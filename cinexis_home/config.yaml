name: CINEXIS Home
version: "4.1.0-pilot.8"
slug: cinexis_home
description: Connect your home to CINEXIS. Enter your email — no server address, no token, no code to scan.
url: https://cinexis.cloud/home-assistant

arch:
  - aarch64
  - amd64

# A pre-built, multi-architecture image, selected by the Supervisor for the
# machine it is installing on and verified by digest.
#
# NOTHING IS COMPILED ON THE CUSTOMER'S DEVICE. This line is the whole reason the
# owner never opens a terminal.
image: "ghcr.io/cinexisin/cinexis-home-{arch}"

startup: application
boot: auto
init: false

# Ingress only. No `ports:` mapping, so nothing on the home network reaches this
# directly — it is served through the Supervisor, which authenticates the Home
# Assistant user first.
ingress: true
ingress_port: 8099
panel_icon: mdi:home-heart
panel_title: CINEXIS Home

apparmor: true

# Read Home Assistant's own API for versions and liveness. The Supervisor issues
# a scoped token it rotates itself, so there is no long-lived credential to store.
homeassistant_api: true

# hassio_api is DELIBERATELY ABSENT. It can install, update and remove other
# add-ons; the everyday owner-facing app has no business holding that.
#
# No `map:` at all. This app reads Home Assistant through the API and keeps its
# own state in /data, which is private to it. /config would expose the customer's
# whole configuration and /share is bind-mounted into every add-on that asks.
#
# No frpc, no shell, no Docker socket, no host control. Remote Support is a
# separate, optional app the owner activates and approves per session.

options:
  log_level: info
schema:
  log_level: list(trace|debug|info|warning|error)
